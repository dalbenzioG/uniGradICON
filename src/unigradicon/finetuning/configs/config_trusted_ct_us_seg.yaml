# Example: finetune multiGradICON on paired CT-US data with segmentation (TRUSTED-style).
# 1) Build the JSON: python -m unigradicon.finetuning.scripts.build_trusted_pairs_json --data_path /path/to/data --output configs/trusted_pairs.json
# 2) Run: unigradicon-finetune --config src/unigradicon/finetuning/configs/config_trusted_ct_us_seg.yaml

experiment:
  name: "trusted_ct_us_seg_finetune"
  model: "multigradicon"
  # Use pretrained: "multigradicon" (auto-download) or "unigradicon". Or your own checkpoint:
  # weights_path: "multigradicon"
  # Path is relative to current working directory (run from repo root). Use /absolute/path if needed.
  weights_path: "weights/Step_2_final.trch"  # e.g. weights/Step_2_final.trch or /path/to/network_weights_50.trch
  # Weights & Biases logging (defaults: use_wandb true, use_tensorboard true)
  # use_wandb: true
  # use_tensorboard: true
  # wandb_project: "unigradicon-finetune"
  # wandb_entity: null
  # wandb_run_name: "trusted_ct_us_seg_finetune"  # default is experiment.name

training:
  input_shape: [175, 175, 175]
  batch_size: 4
  gpus: [0]
  epochs: 200
  eval_period: 10
  save_period: 50
  learning_rate: 0.00005
  similarity: "lncc"
  lambda: 1.5
  dice_loss_weight: 0.3
  lncc_sigma: 5

datasets:
  - name: "trusted_ct_us_seg"
    type: "paired_ct_us_seg"
    weight: 1.0
    json_file: "trusted_pairs.json"
    ct_window: [-1000, 1000]
    quantile_range: [0.0, 1.0]
    # Optional: pre-computed affine transforms (e.g. US resampled into CT space)
    affine_transforms_dir: "../datasets/TRUSTED/rigid_masks_transforms"
    affine_direction: "us_to_ct"   # or "ct_to_us"
    affine_type: "rigid_mask"
