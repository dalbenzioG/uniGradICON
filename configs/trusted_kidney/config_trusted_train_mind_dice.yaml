experiment:
  name: trusted_train_mind_dice
  use_wandb: true
  wandb_project: multigradicon-train
  wandb_run_name: trusted_scratch_mind_dice_2stage

training:
  stage_epochs: [150, 50]
  batch_size: 1
  gpus: [0]
  eval_period: 10
  save_period: 25
  learning_rate: 0.00005
  input_shape: [175, 175, 175]
  similarity: mind
  mind_radius: 2
  mind_dilation: 2
  dice_loss_weight: 0.3
  lambda: 1.5
  use_label: false
  loss_function_masking: false
  roi_masking: false
  num_workers: 4
  seed: 42

datasets:
  - name: kidney_ct_us_paired
    type: paired
    json_file: kidney_finetuning_pairs.json
    use_cache: false
    weight: 1.0
    is_ct: false
    quantile_range: [0.005, 0.995]
    ct_window: [-1000, 1000]
